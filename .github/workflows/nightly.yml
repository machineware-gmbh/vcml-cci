name: nightly

on:
  schedule:
    - cron: '0 20 * * *'

env:
  BUILD_TYPE: RELEASE
  GITHUB_TOKEN: ${{secrets.CI_TOKEN}}

jobs:
  nightly:
    name: nightly
    runs-on: ${{matrix.os}}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm, windows-2022]

    steps:
    - name: Checkout VCML CCI
      uses: actions/checkout@v6
      with:
        submodules: 'recursive'
        token: ${{secrets.CI_TOKEN}}

    - name: Configure
      if: runner.os != 'Windows'
      run: |
        cmake -B BUILD -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
                                -DSYSTEMC_UNITY_BUILD=ON \
                                -DVCML_UNITY_BUILD=ON \
                                -DVCML_CCI_TESTS=ON .

    - name: Configure (Windows)
      if: runner.os == 'Windows'
      run: cmake -B BUILD -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DVCML_CCI_TESTS=ON .

    - name: Build
      if: runner.os != 'Windows'
      run: cmake --build BUILD

    - name: Build (Windows)
      if: runner.os == 'Windows'
      run: cmake --build BUILD --config ${{env.BUILD_TYPE}} -- /bl

    - name: Test
      working-directory: BUILD
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure

    - name: Upload Logs
      uses: actions/upload-artifact@v7
      if: '!cancelled()'
      with:
        name: ${{github.event.repository.name}}-logs-${{matrix.os}}
        path: |
            BUILD/.ninja_log
            BUILD/CMakeCache.txt
            BUILD/msbuild.binlog
            BUILD/Testing/Temporary/LastTest.log
        include-hidden-files: true
        retention-days: 7

  nightly-alma8:
      name: nightly (almalinux-8)
      runs-on: ubuntu-latest
      container:
          image: docker.io/almalinux:8

      steps:
      - name: Install dependencies
        run: |
            dnf install -y dnf-utils
            dnf config-manager --set-enabled powertools
            dnf -y groupinstall "Development Tools"
            dnf -y install epel-release cmake ninja-build

      - name: Checkout VCML CCI
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          token: ${{secrets.CI_TOKEN}}

      - name: Configure
        run: |
          cmake -B BUILD -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
                                  -DSYSTEMC_UNITY_BUILD=ON \
                                  -DVCML_UNITY_BUILD=ON \
                                  -DVCML_CCI_TESTS=ON .


      - name: Build
        run: cmake --build BUILD

      - name: Test
        working-directory: BUILD
        run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure

      - name: Upload Logs
        uses: actions/upload-artifact@v7
        if: '!cancelled()'
        with:
          name: ${{github.event.repository.name}}-logs-almalinux-8
          path: |
              BUILD/.ninja_log
              BUILD/CMakeCache.txt
              BUILD/msbuild.binlog
              BUILD/Testing/Temporary/LastTest.log
          include-hidden-files: true
          retention-days: 7
